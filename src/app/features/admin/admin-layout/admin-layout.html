<div class="flex h-screen bg-[color:var(--blanco-calido)]">
    <!-- Sidebar -->
    <aside
        class="fixed inset-y-0 left-0 z-40 flex flex-col bg-[color:var(--cafe-oscuro)] text-white transition-all duration-300"
        [class.w-64]="sidebarOpen()"
        [class.w-0]="!sidebarOpen()"
        [class.md:w-64]="!sidebarOpen()">

        <!-- Logo -->
        <div class="flex items-center gap-3 px-6 py-5 border-b border-white/10">
            <div class="w-10 h-10 bg-gradient-to-br from-[color:var(--terracota)] to-[color:var(--terracota-dark)] rounded-xl flex items-center justify-center shadow-md shrink-0">
                <span class="text-white text-xl">🍲</span>
            </div>
            <div class="overflow-hidden">
                <h1 class="text-lg whitespace-nowrap">Admin Panel</h1>
                <p class="text-xs text-[color:var(--tierra-light)] whitespace-nowrap">Platos Típicos</p>
            </div>
        </div>

        <!-- Nav Links -->
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-hidden">
            <a routerLink="/admin" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="bg-[color:var(--terracota)] text-white"
                class="flex items-center gap-3 px-4 py-3 rounded-lg text-[color:var(--tierra-light)] hover:bg-white/10 transition-colors whitespace-nowrap">
                <lucide-icon name="layout-dashboard" class="w-5 h-5 shrink-0"></lucide-icon>
                <span>Dashboard</span>
            </a>
            <a routerLink="/admin/platos" routerLinkActive="bg-[color:var(--terracota)] text-white"
                class="flex items-center gap-3 px-4 py-3 rounded-lg text-[color:var(--tierra-light)] hover:bg-white/10 transition-colors whitespace-nowrap">
                <lucide-icon name="chef-hat" class="w-5 h-5 shrink-0"></lucide-icon>
                <span>Platos</span>
            </a>
            <a routerLink="/admin/categorias" routerLinkActive="bg-[color:var(--terracota)] text-white"
                class="flex items-center gap-3 px-4 py-3 rounded-lg text-[color:var(--tierra-light)] hover:bg-white/10 transition-colors whitespace-nowrap">
                <lucide-icon name="tag" class="w-5 h-5 shrink-0"></lucide-icon>
                <span>Categorías</span>
            </a>
            <a routerLink="/admin/regiones" routerLinkActive="bg-[color:var(--terracota)] text-white"
                class="flex items-center gap-3 px-4 py-3 rounded-lg text-[color:var(--tierra-light)] hover:bg-white/10 transition-colors whitespace-nowrap">
                <lucide-icon name="map-pin" class="w-5 h-5 shrink-0"></lucide-icon>
                <span>Regiones</span>
            </a>
        </nav>

        <!-- Footer -->
        <div class="px-4 py-4 border-t border-white/10">
            <a routerLink="/"
                class="flex items-center gap-3 px-4 py-3 rounded-lg text-[color:var(--tierra-light)] hover:bg-white/10 transition-colors whitespace-nowrap">
                <lucide-icon name="arrow-left" class="w-5 h-5 shrink-0"></lucide-icon>
                <span>Volver al sitio</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col transition-all duration-300"
        [class.md:ml-64]="true"
        [class.ml-0]="!sidebarOpen()"
        [class.ml-64]="sidebarOpen()">

        <!-- Top Bar -->
        <header class="sticky top-0 z-30 bg-white border-b shadow-sm px-6 py-4 flex items-center gap-4">
            <button (click)="toggleSidebar()" class="md:hidden p-2 rounded-lg hover:bg-gray-100">
                <lucide-icon name="menu" class="w-5 h-5"></lucide-icon>
            </button>
            <h2 class="text-lg text-[color:var(--cafe-oscuro)]">Administración</h2>
        </header>

        <!-- Page Content -->
        <main class="flex-1 overflow-y-auto p-6">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
